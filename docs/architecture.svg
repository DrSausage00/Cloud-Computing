<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 1180" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1360" height="1180" fill="#ffffff"/>

  <text x="680" y="38" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a">MES Streaming Pipeline — Architektur (Kappa)</text>
  <text x="680" y="60" text-anchor="middle" font-size="13" fill="#64748b">Kubernetes-Namespace "mes" · DHBW Cloud (k3s, 3 Nodes) / minikube</text>

  <!-- Cluster boundary -->
  <rect x="30" y="80" width="1300" height="1070" rx="14" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="50" y="104" font-size="13" font-weight="600" fill="#64748b">Namespace: mes</text>

  <!-- ===== Row 1: Ingestion ===== -->
  <text x="60" y="140" font-size="13" font-weight="700" fill="#0f172a">Ingestion (Deployment × 3, je Maschinentyp gefiltert)</text>

  <g>
    <rect x="60" y="155" width="230" height="86" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="175" y="180" text-anchor="middle" font-size="14" font-weight="600" fill="#1e3a8a">ingestion-a</text>
    <text x="175" y="198" text-anchor="middle" font-size="11" fill="#334155">MACHINE_TYPES=A</text>
    <text x="175" y="214" text-anchor="middle" font-size="11" fill="#334155">JSON-Format</text>
    <text x="175" y="230" text-anchor="middle" font-size="10" fill="#64748b">→ Partition 0</text>
  </g>
  <g>
    <rect x="330" y="155" width="230" height="86" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="445" y="180" text-anchor="middle" font-size="14" font-weight="600" fill="#1e3a8a">ingestion-b</text>
    <text x="445" y="198" text-anchor="middle" font-size="11" fill="#334155">MACHINE_TYPES=B</text>
    <text x="445" y="214" text-anchor="middle" font-size="11" fill="#334155">JSON, andere Feldnamen</text>
    <text x="445" y="230" text-anchor="middle" font-size="10" fill="#64748b">→ Partition 1</text>
  </g>
  <g>
    <rect x="600" y="155" width="230" height="86" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="715" y="180" text-anchor="middle" font-size="14" font-weight="600" fill="#1e3a8a">ingestion-c</text>
    <text x="715" y="198" text-anchor="middle" font-size="11" fill="#334155">MACHINE_TYPES=C</text>
    <text x="715" y="214" text-anchor="middle" font-size="11" fill="#334155">Pipe-separiert</text>
    <text x="715" y="230" text-anchor="middle" font-size="10" fill="#64748b">→ Partition 2</text>
  </g>
  <text x="1040" y="190" font-size="11" fill="#64748b" text-anchor="middle">Bewusst KEIN "replicas: 3" —</text>
  <text x="1040" y="206" font-size="11" fill="#64748b" text-anchor="middle">jede Replica würde denselben Typ</text>
  <text x="1040" y="222" font-size="11" fill="#64748b" text-anchor="middle">doppelt erzeugen (Duplikate).</text>

  <!-- arrows down to kafka -->
  <line x1="175" y1="241" x2="175" y2="278" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="445" y1="241" x2="445" y2="278" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="715" y1="241" x2="715" y2="278" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===== Row 2: Kafka ===== -->
  <rect x="60" y="280" width="770" height="80" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="445" y="308" text-anchor="middle" font-size="15" font-weight="700" fill="#78350f">Kafka (StatefulSet, 3 Broker, KRaft-Modus)</text>
  <text x="445" y="328" text-anchor="middle" font-size="11" fill="#78350f">Topic "machine-events" · 3 Partitionen (Key = machine_id) · Retention 7 Tage (= Bronze in Kappa)</text>
  <text x="445" y="345" text-anchor="middle" font-size="10" fill="#92400e">Broker skalieren durch mehr Partitionen — nicht durch mehr Broker allein</text>

  <!-- label sits clear above the arrow band, arrows occupy a separate lower band -->
  <text x="60" y="378" font-size="13" font-weight="700" fill="#0f172a">Stream Processing (Deployment × 3, Spark Structured Streaming, je Maschinentyp gefiltert)</text>
  <line x1="175" y1="386" x2="175" y2="424" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="445" y1="386" x2="445" y2="424" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="715" y1="386" x2="715" y2="424" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===== Row 3: Stream Processing ===== -->
  <g>
    <rect x="60" y="428" width="230" height="110" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <text x="175" y="452" text-anchor="middle" font-size="14" font-weight="600" fill="#14532d">stream-processing-a</text>
    <text x="175" y="470" text-anchor="middle" font-size="11" fill="#334155">Filter: machine_type=A</text>
    <text x="175" y="486" text-anchor="middle" font-size="11" fill="#334155">10s-Fenster, Watermark 30s</text>
    <text x="175" y="502" text-anchor="middle" font-size="11" fill="#334155">last_status, temp_limit-Check</text>
    <text x="175" y="522" text-anchor="middle" font-size="10" fill="#64748b">eigener Checkpoint-Pfad</text>
  </g>
  <g>
    <rect x="330" y="428" width="230" height="110" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <text x="445" y="452" text-anchor="middle" font-size="14" font-weight="600" fill="#14532d">stream-processing-b</text>
    <text x="445" y="470" text-anchor="middle" font-size="11" fill="#334155">Filter: machine_type=B</text>
    <text x="445" y="486" text-anchor="middle" font-size="11" fill="#334155">10s-Fenster, Watermark 30s</text>
    <text x="445" y="502" text-anchor="middle" font-size="11" fill="#334155">last_status, temp_limit-Check</text>
    <text x="445" y="522" text-anchor="middle" font-size="10" fill="#64748b">eigener Checkpoint-Pfad</text>
  </g>
  <g>
    <rect x="600" y="428" width="230" height="110" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <text x="715" y="452" text-anchor="middle" font-size="14" font-weight="600" fill="#14532d">stream-processing-c</text>
    <text x="715" y="470" text-anchor="middle" font-size="11" fill="#334155">Filter: machine_type=C</text>
    <text x="715" y="486" text-anchor="middle" font-size="11" fill="#334155">10s-Fenster, Watermark 30s</text>
    <text x="715" y="502" text-anchor="middle" font-size="11" fill="#334155">last_status, temp_limit-Check</text>
    <text x="715" y="522" text-anchor="middle" font-size="10" fill="#64748b">eigener Checkpoint-Pfad</text>
  </g>
  <text x="1040" y="468" font-size="11" fill="#64748b" text-anchor="middle">Grenze: skaliert nur bis zur</text>
  <text x="1040" y="484" font-size="11" fill="#64748b" text-anchor="middle">Kafka-Partitionszahl (hier 3) —</text>
  <text x="1040" y="500" font-size="11" fill="#64748b" text-anchor="middle">mehr Instanzen ohne mehr</text>
  <text x="1040" y="516" font-size="11" fill="#64748b" text-anchor="middle">Partitionen bringen nichts.</text>

  <line x1="175" y1="538" x2="175" y2="576" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="445" y1="538" x2="445" y2="576" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="715" y1="538" x2="715" y2="576" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===== Row 4: MinIO (title now INSIDE the box, like Kafka, no external label to collide with arrows) ===== -->
  <rect x="60" y="578" width="770" height="170" rx="10" fill="#fdf2f8" stroke="#db2777" stroke-width="1.5"/>
  <text x="445" y="602" text-anchor="middle" font-size="14" font-weight="700" fill="#831843">MinIO (StatefulSet, 4 Nodes, Distributed + Erasure Coding) — Silver-Schicht</text>

  <rect x="80" y="616" width="230" height="60" rx="8" fill="#ffffff" stroke="#db2777" stroke-width="1"/>
  <text x="195" y="638" text-anchor="middle" font-size="12" font-weight="600" fill="#831843">bronze/machine-events</text>
  <text x="195" y="654" text-anchor="middle" font-size="10" fill="#334155">partitioniert: event_date</text>
  <text x="195" y="668" text-anchor="middle" font-size="10" fill="#64748b">Rohereignisse, native Sink</text>

  <rect x="330" y="616" width="230" height="60" rx="8" fill="#ffffff" stroke="#db2777" stroke-width="1"/>
  <text x="445" y="638" text-anchor="middle" font-size="12" font-weight="600" fill="#831843">silver/machine-metrics</text>
  <text x="445" y="654" text-anchor="middle" font-size="10" fill="#334155">partitioniert: machine_type / event_date</text>
  <text x="445" y="668" text-anchor="middle" font-size="10" fill="#64748b">10s-Aggregate (Silver)</text>

  <rect x="580" y="616" width="230" height="60" rx="8" fill="#ffffff" stroke="#db2777" stroke-width="1"/>
  <text x="695" y="638" text-anchor="middle" font-size="12" font-weight="600" fill="#831843">silver/machine-status</text>
  <text x="695" y="654" text-anchor="middle" font-size="10" fill="#334155">partitioniert: machine_type</text>
  <text x="695" y="668" text-anchor="middle" font-size="10" fill="#64748b">letzter bekannter Status</text>

  <text x="195" y="700" text-anchor="middle" font-size="10" fill="#64748b">Bucket "mes-data"</text>
  <text x="195" y="716" text-anchor="middle" font-size="10" fill="#64748b">+ separater Bucket</text>
  <text x="195" y="730" text-anchor="middle" font-size="10" fill="#64748b">"spark-checkpoints"</text>

  <!-- Compaction cronjobs box -->
  <rect x="850" y="578" width="250" height="170" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="975" y="603" text-anchor="middle" font-size="13" font-weight="700" fill="#7c2d12">CronJobs (Kompaktierung)</text>
  <text x="975" y="628" text-anchor="middle" font-size="11" fill="#334155">silver-compaction</text>
  <text x="975" y="643" text-anchor="middle" font-size="10" fill="#64748b">alle 30 Min · viele kleine</text>
  <text x="975" y="656" text-anchor="middle" font-size="10" fill="#64748b">Dateien → 1 Datei/Partition</text>
  <text x="975" y="682" text-anchor="middle" font-size="11" fill="#334155">bronze-compaction</text>
  <text x="975" y="697" text-anchor="middle" font-size="10" fill="#64748b">alle 10 Min · gleiche Logik</text>
  <text x="975" y="710" text-anchor="middle" font-size="10" fill="#64748b">für die Rohdaten-Ablage</text>
  <line x1="850" y1="663" x2="812" y2="663" stroke="#ea580c" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="445" y1="748" x2="445" y2="786" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===== Row 5: Serving API ===== -->
  <rect x="270" y="788" width="350" height="90" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="445" y="814" text-anchor="middle" font-size="15" font-weight="700" fill="#312e81">Serving-API (Deployment)</text>
  <text x="445" y="833" text-anchor="middle" font-size="11" fill="#334155">FastAPI · GET /metrics/latest, /metrics/history</text>
  <text x="445" y="849" text-anchor="middle" font-size="11" fill="#334155">HPA: 1–5 Pods, Ziel 50 % CPU</text>
  <text x="445" y="865" text-anchor="middle" font-size="10" fill="#64748b">Partition Pruning + TTL-Cache gegen volle Table-Scans</text>

  <line x1="445" y1="878" x2="445" y2="916" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===== Row 6: UI ===== -->
  <rect x="270" y="918" width="350" height="80" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="445" y="946" text-anchor="middle" font-size="15" font-weight="700" fill="#4c1d95">UI (Deployment, 2+ Replicas)</text>
  <text x="445" y="966" text-anchor="middle" font-size="11" fill="#334155">Dash-App · Kacheln je Maschine, Detail-Zeitreihe</text>
  <text x="445" y="984" text-anchor="middle" font-size="10" fill="#64748b">Polling alle 5s über die Serving-API, kein direkter Datenzugriff</text>

  <!-- Legend -->
  <text x="60" y="1030" font-size="13" font-weight="700" fill="#0f172a">Legende</text>
  <rect x="60" y="1042" width="18" height="14" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="86" y="1054" font-size="11" fill="#334155">Deployment (zustandslos, horizontal skaliert)</text>
  <rect x="60" y="1064" width="18" height="14" fill="#fef3c7" stroke="#d97706"/>
  <text x="86" y="1076" font-size="11" fill="#334155">StatefulSet + PVC</text>
  <rect x="60" y="1086" width="18" height="14" fill="#fff7ed" stroke="#ea580c"/>
  <text x="86" y="1098" font-size="11" fill="#334155">CronJob (Batch, kein Dauerbetrieb)</text>

  <text x="500" y="1054" font-size="11" fill="#334155">Konfiguration: ConfigMap "pipeline-config" (Grenzwerte, Pfade, Timeouts)</text>
  <text x="500" y="1076" font-size="11" fill="#334155">Secrets: Kubernetes Secret "minio-credentials"</text>
  <text x="500" y="1098" font-size="11" fill="#334155">Kein separater Batch-Layer — Kappa: ein Pfad für alle Daten</text>

  <text x="1340" y="1170" text-anchor="end" font-size="9" fill="#94a3b8">Stand: entspricht dem tatsächlich deployten Helm-Chart (charts/mes-pipeline)</text>
</svg>
