name: Restart stream-processing

on:
  workflow_dispatch:

jobs:
  restart:
    runs-on: ubuntu-latest
    steps:
      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.31.0"

      - name: Rollout restart
        run: |
          cat <<EOF > kubeconfig.yaml
          apiVersion: v1
          kind: Config
          clusters:
            - name: mes
              cluster:
                server: https://${{ vars.K8S_API_HOST }}
          contexts:
            - name: mes
              context:
                cluster: mes
                namespace: mes
                user: github-actions
          current-context: mes
          users:
            - name: github-actions
              user:
                token: ${{ secrets.K8S_SA_TOKEN }}
          EOF
          export KUBECONFIG=kubeconfig.yaml
          kubectl rollout restart deployment/stream-processing-a deployment/stream-processing-b deployment/stream-processing-c -n mes
