name: Build & Push stream-processing

on:
  push:
    branches: [main]
    paths:
      - "stream-processing/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.REGISTRY_HOST }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASS }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: stream-processing
          push: true
          tags: |
            ${{ vars.REGISTRY_HOST }}/mes/stream-processing:0.1
            ${{ vars.REGISTRY_HOST }}/mes/stream-processing:${{ steps.sha.outputs.short }}
      
      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.31.0"

      - name: Rollout restart
        run: |
          cat <<EOF > kubeconfig.yaml
          apiVersion: v1
          kind: Config
          clusters:
            - name: mes
              cluster:
                server: https://${{ vars.K8S_API_HOST }}
          contexts:
            - name: mes
              context:
                cluster: mes
                namespace: mes
                user: github-actions
          current-context: mes
          users:
            - name: github-actions
              user:
                token: ${{ secrets.K8S_SA_TOKEN }}
          EOF
          export KUBECONFIG=kubeconfig.yaml
          kubectl rollout restart deployment/stream-processing -n mes