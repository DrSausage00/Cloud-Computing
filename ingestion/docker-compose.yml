services:
  kafka:
    image: docker.io/apache/kafka@sha256:77e3df9054047a88b520d0cc46e16696d3b22022e1d580aeccd2632df6532837
    container_name: kafka

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092


      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAME: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data

  minio:
    image : docker.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    container_name: minio

    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes: 
      - minio_data:/data
  minio-init:
    image: docker.io/minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    container_name: minio-init

    depends_on:
      - minio

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_APP_USER: ${MINIO_APP_USER}
      MINIO_APP_PASSWORD: ${MINIO_APP_PASSWORD}
      MINIO_DATA_BUCKET: ${MINIO_DATA_BUCKET}
      MINIO_CHECKPOINT_BUCKET: ${MINIO_CHECKPOINT_BUCKET}

    entrypoint: ["/bin/sh", "-c"]

    command:
      - |
        set -e

        echo "Waiting for MinIO..."

        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do
          echo "MinIO not ready yet..."
          sleep 2
        done

        echo "MinIO is ready."

        echo "Creating data bucket: $$MINIO_DATA_BUCKET"
        mc mb --ignore-existing "local/$$MINIO_DATA_BUCKET"

        echo "Creating checkpoint bucket: $$MINIO_CHECKPOINT_BUCKET"
        mc mb --ignore-existing "local/$$MINIO_CHECKPOINT_BUCKET"

        echo "Creating application user: $$MINIO_APP_USER"
        mc admin user add local "$$MINIO_APP_USER" "$$MINIO_APP_PASSWORD" || true

        echo "Assigning readwrite policy..."
        mc admin policy attach local readwrite --user "$$MINIO_APP_USER"

        echo "MinIO initialization finished successfully."
  kafka-init:
    image: docker.io/apache/kafka@sha256:77e3df9054047a88b520d0cc46e16696d3b22022e1d580aeccd2632df6532837
    container_name: kafka-init

    depends_on:
      - kafka

    entrypoint: ["/bin/sh", "-c"]       
    
    command:
      - |
        set -e
        echo "Waiting for Kafka to be ready..."
        until /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:29092 \
          --list > /dev/null 2>&1;
        do 
          echo "Kafka not ready yet..."
          sleep 2
        done
        echo "Kafka is ready."

        echo "Creating topic: machine-events"

        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:29092 \
          --create \
          --if-not-exists \
          --topic machine-events \
          --partitions 3 \
          --replication-factor 1
        echo "Kafka initialization finished."

volumes:
  kafka_data:
  minio_data:
