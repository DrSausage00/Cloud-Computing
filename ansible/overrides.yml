all:
  vars:
    # local-path reicht bei 124 MB/Tag; kein Storage-Failover noetig.
    longhorn_enabled: false
    # Kein naechtlicher Cluster-Neustart waehrend der Projektwoche.
    k3s_auto_upgrade_enabled: false
    # Fester Name statt IPv6-Adresse im Dateinamen - sonst Doppelpunkt-
    # Problem auf dem NTFS-Mount unter /mnt/c.
    kubeconfig_path: "{{ playbook_dir }}/kubeconfig-mes.yaml"
