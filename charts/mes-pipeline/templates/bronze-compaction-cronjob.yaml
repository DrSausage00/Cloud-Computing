apiVersion: batch/v1
kind: CronJob
metadata:
  name: bronze-compaction
  namespace: {{ .Release.Namespace }}
spec:
  schedule: "*/10 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: compact
              image: {{ include "mes.image" (dict "ctx" . "image" .Values.streamProcessing.image "tag" .Values.streamProcessing.tag) | quote }}
              imagePullPolicy: Always
              resources:
                requests:
                  cpu: 500m
                  memory: 2Gi
                limits:
                  cpu: "2"
                  memory: 5Gi
              command:
                - /opt/spark/bin/spark-submit
                - --driver-memory
                - "3g"
                - --packages
                - org.apache.hadoop:hadoop-aws:3.5.0
                - /app/compact.py
              envFrom:
                - configMapRef:
                    name: pipeline-config
                - secretRef:
                    name: minio-credentials
              env:
                - name: JAVA_TOOL_OPTIONS
                  value: "-Duser.home=/tmp"
                - name: TABLE_PATH
                  value: "bronze/machine-events"
                - name: PARTITION_COLS
                  value: "machine_type,event_date"