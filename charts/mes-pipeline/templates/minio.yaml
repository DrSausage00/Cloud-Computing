apiVersion: v1
kind: Service
metadata:
  name: minio-headless
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mes.selectorLabels" (dict "ctx" . "component" "minio") | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "mes.selectorLabels" (dict "ctx" . "component" "minio") | nindent 4 }}
  ports:
    - name: api
      port: 9000
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mes.selectorLabels" (dict "ctx" . "component" "minio") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "mes.selectorLabels" (dict "ctx" . "component" "minio") | nindent 4 }}
  ports:
    - name: api
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mes.selectorLabels" (dict "ctx" . "component" "minio") | nindent 4 }}
spec:
  serviceName: minio-headless
  replicas: {{ .Values.minio.replicaCount }}
  selector:
    matchLabels:
      {{- include "mes.selectorLabels" (dict "ctx" . "component" "minio") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mes.selectorLabels" (dict "ctx" . "component" "minio") | nindent 8 }}
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      containers:
        - name: minio
          image: {{ .Values.minio.image | quote }}
          ports:
            - containerPort: 9000
              name: api
            - containerPort: 9001
              name: console
          resources:
            {{- toYaml .Values.minio.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 15
          volumeMounts:
            - name: data
              mountPath: /data
          args:
            - server
            - "http://minio-{0...{{ sub (.Values.minio.replicaCount | int) 1 }}}.minio-headless.{{ .Release.Namespace }}.svc.cluster.local/data"
            - "--console-address"
            - ":9001"
          envFrom:
            - secretRef:
                name: minio-credentials
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.minio.storage }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: create-buckets
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: create-buckets
          image: minio/mc:latest
          envFrom:
            - configMapRef:
                name: pipeline-config
            - secretRef:
                name: minio-credentials
          command:
            - /bin/sh
            - -c
            - |
              until mc alias set local http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"; do
                echo "MinIO noch nicht bereit..."; sleep 2
              done
              mc mb --ignore-existing "local/$MINIO_DATA_BUCKET"
              mc mb --ignore-existing "local/$SPARK_CHECKPOINT_BUCKET"
              echo "Buckets angelegt: $MINIO_DATA_BUCKET, $SPARK_CHECKPOINT_BUCKET"