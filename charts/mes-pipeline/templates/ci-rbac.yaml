apiVersion: v1
kind: ServiceAccount
metadata:
  name: github-actions-restarter
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: github-actions-restarter
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: github-actions-restarter
  namespace: {{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: github-actions-restarter
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: github-actions-restarter
  apiGroup: rbac.authorization.k8s.io
