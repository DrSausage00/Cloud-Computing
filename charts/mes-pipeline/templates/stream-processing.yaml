apiVersion: v1
kind: ServiceAccount
metadata:
  name: spark
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: spark-executor-manager
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "delete", "deletecollection"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spark-executor-manager
  namespace: {{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: spark
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: spark-executor-manager
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: Service
metadata:
  name: stream-processing-driver
  namespace: {{ .Release.Namespace }}
  labels:
    mes.family: stream-processing
spec:
  clusterIP: None
  selector:
    mes.family: stream-processing
  ports:
    - name: driver-rpc
      port: 7078
    - name: driver-blockmanager
      port: 7079
---
{{- range .Values.streamProcessing.instances }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stream-processing-{{ .name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app: stream-processing-{{ .name }}
    mes.family: stream-processing
    app.kubernetes.io/instance: {{ $.Release.Name }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: stream-processing-{{ .name }}
      app.kubernetes.io/instance: {{ $.Release.Name }}
  template:
    metadata:
      labels:
        app: stream-processing-{{ .name }}
        mes.family: stream-processing
        app.kubernetes.io/instance: {{ $.Release.Name }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") $ | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") $ | sha256sum }}
    spec:
      containers:
        - name: stream-processing
          image: {{ include "mes.image" (dict "ctx" $ "image" $.Values.streamProcessing.image "tag" $.Values.streamProcessing.tag) | quote }}
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          resources:
            {{- toYaml $.Values.streamProcessing.resources | nindent 12 }}
          livenessProbe:
            exec:
              command: ["sh", "-c", "pgrep -f streaming_job.py > /dev/null"]
            initialDelaySeconds: 150
            periodSeconds: 30
          envFrom:
            - configMapRef:
                name: pipeline-config
            - secretRef:
                name: minio-credentials
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-Duser.home=/tmp"
            - name: MACHINE_TYPES
              value: {{ .machineTypes | quote }}
---
{{- end }}