apiVersion: v1
kind: ServiceAccount
metadata:
  name: spark
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: spark-executor-manager
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "delete", "deletecollection"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spark-executor-manager
  namespace: {{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: spark
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: spark-executor-manager
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: Service
metadata:
  name: stream-processing-driver
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mes.selectorLabels" (dict "ctx" . "component" "stream-processing") | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "mes.selectorLabels" (dict "ctx" . "component" "stream-processing") | nindent 4 }}
  ports:
    - name: driver-rpc
      port: 7078
    - name: driver-blockmanager
      port: 7079
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stream-processing
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mes.selectorLabels" (dict "ctx" . "component" "stream-processing") | nindent 4 }}
spec:
  replicas: {{ .Values.streamProcessing.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "mes.selectorLabels" (dict "ctx" . "component" "stream-processing") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mes.selectorLabels" (dict "ctx" . "component" "stream-processing") | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      containers:
        - name: stream-processing
          image: {{ include "mes.image" (dict "ctx" . "image" .Values.streamProcessing.image "tag" .Values.streamProcessing.tag) | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          resources:
            {{- toYaml .Values.streamProcessing.resources | nindent 12 }}
          livenessProbe:
            exec:
              command: ["sh", "-c", "pgrep -f streaming_job.py > /dev/null"]
            initialDelaySeconds: 150
            periodSeconds: 30
          envFrom:
            - configMapRef:
                name: pipeline-config
            - secretRef:
                name: minio-credentials
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-Duser.home=/tmp"
