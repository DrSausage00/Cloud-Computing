{{- range .Values.ingestion.instances }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion-{{ .name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app: ingestion-{{ .name }}
    mes.family: ingestion
    app.kubernetes.io/instance: {{ $.Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ingestion-{{ .name }}
      app.kubernetes.io/instance: {{ $.Release.Name }}
  template:
    metadata:
      labels:
        app: ingestion-{{ .name }}
        mes.family: ingestion
        app.kubernetes.io/instance: {{ $.Release.Name }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") $ | sha256sum }}
    spec:
      initContainers:
        - name: wait-for-kafka
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z -w 2 kafka 9092; do
                echo "Warte auf Kafka..."; sleep 2
              done
      containers:
        - name: ingestion
          image: {{ include "mes.image" (dict "ctx" $ "image" $.Values.ingestion.image "tag" $.Values.ingestion.tag) | quote }}
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          ports:
            - containerPort: 80
          resources:
            {{- toYaml $.Values.ingestion.resources | nindent 12 }}
          livenessProbe:
            exec:
              command: ["sh", "-c", "pgrep -f main.py > /dev/null"]
            initialDelaySeconds: 15
            periodSeconds: 30
          envFrom:
            - configMapRef:
                name: pipeline-config
          env:
            - name: MACHINE_TYPES
              value: {{ .machineTypes | quote }}
---
{{- end }}
