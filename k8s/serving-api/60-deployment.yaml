apiVersion: apps/v1
kind: Deployment
metadata:
  name: serving-api
  namespace: mes
  labels:
    app: serving-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: serving-api
  template:
    metadata:
      labels:
        app: serving-api
    spec:
      containers:
        - name: serving-api
          image: mes/serving-api:0.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /metrics/latest     # TBD: replace when ready function exists
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /docs     # TBD: replace when live path (health) exists
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
          envFrom:
            - configMapRef:
                name: pipeline-config
            - secretRef:
                name: minio-credentials