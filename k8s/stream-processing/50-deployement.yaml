apiVersion: apps/v1
kind: Deployment
metadata:
  name: stream-processing
  namespace: mes
  labels:
    app: stream-processing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stream-processing
  template:
    metadata:
      labels:
        app: stream-processing
    spec:
      containers:
        - name: stream-processing
          image: nginx:alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
