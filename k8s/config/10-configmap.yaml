apiVersion: v1
kind: ConfigMap
metadata:
  name: pipeline-config
  namespace: mes
data:
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  TEMP_LIMIT: "85"
  MINIO_ENDPOINT: "http://minio:9000"
  MINIO_DATA_BUCKET: "mes-data"
  SPARK_CHECKPOINT_BUCKET: "spark-checkpoints" 
  SPARK_CHECKPOINT_DIR: "s3a://spark-checkpoints/checkpoints"
  USE_MOCK: "false"
  API_BASE_URL: "http://serving-api:8000"
  POLL_INTERVAL_SECONDS: "5"
  HISTORY_MINUTES: "15"
  S3_CONNECT_TIMEOUT: "5"
  S3_READ_TIMEOUT: "10"
  S3_RETRY_MAX_ATTEMPTS: "1"
  S3_USE_LISTINGS_CACHE: "false"
  S3_CACHE_TTL_SECONDS: "30"
  API_TIMEOUT_SECONDS: "10"
  CACHE_TTL_SECONDS: "3"
  SILVER_TABLE_PATH: "silver/machine-metrics"
